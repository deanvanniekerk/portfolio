<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 192" role="img" aria-labelledby="title desc">
  <title id="title">Aspen banner</title>
  <desc id="desc">Dark Aspen branded banner with flowing ribbon and create build grow text.</desc>
  <defs>
    <radialGradient id="leftGlow" cx="32%" cy="10%" r="54%">
      <stop offset="0%" stop-color="#33104c"></stop>
      <stop offset="48%" stop-color="#12051d"></stop>
      <stop offset="100%" stop-color="#05040a"></stop>
    </radialGradient>
    <linearGradient id="ribbon" x1="286" x2="676" y1="8" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#110815"></stop>
      <stop offset="36%" stop-color="#2b1628"></stop>
      <stop offset="61%" stop-color="#e55a37"></stop>
      <stop offset="100%" stop-color="#160810"></stop>
    </linearGradient>
    <linearGradient id="ribbon2" x1="400" x2="616" y1="14" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09040f"></stop>
      <stop offset="42%" stop-color="#291421"></stop>
      <stop offset="100%" stop-color="#d7513b"></stop>
    </linearGradient>
    <filter id="blurGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"></feGaussianBlur>
    </filter>
  </defs>
  <rect width="1128" height="192" fill="url(#leftGlow)"></rect>
  <rect x="710" width="418" height="192" fill="#030308" opacity=".88"></rect>
  <path d="M337-26c-38 22-41 83 1 99 62 24 224-72 291-20 24 19 21 53-2 77-42 45-122 39-168 9" fill="none" stroke="url(#ribbon)" stroke-width="48" stroke-linecap="round"></path>
  <path d="M592 64c12 36-4 80-54 122" fill="none" stroke="url(#ribbon2)" stroke-width="42" stroke-linecap="round"></path>
  <path d="M356 74c18 19 63 15 108 0" fill="none" stroke="#f154ff" stroke-width="8" stroke-linecap="round" filter="url(#blurGlow)" opacity=".9"></path>
  <path d="M589 67c11 23 7 47-10 73" fill="none" stroke="#ff7b5d" stroke-width="8" stroke-linecap="round" filter="url(#blurGlow)" opacity=".9"></path>
  <g font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" letter-spacing=".04em">
    <text x="796" y="163" fill="#7d35e8">CREATE</text>
    <rect x="897" y="142" width="2" height="28" fill="#2f233f"></rect>
    <text x="922" y="163" fill="#ba49bd">BUILD</text>
    <rect x="1004" y="142" width="2" height="28" fill="#2f233f"></rect>
